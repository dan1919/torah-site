<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>חידושי הד״ע | דברי תורה מאת דן עוגן</title>
  <meta name="description" content="אוסף דברי תורה וחידושים מאת דן עוגן – לפי פרשות השבוע, מועדים ונושאים כלליים">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f3eb;
      --bg-card: #ffffff;
      --bg-header: #1a365d;
      --text: #2d3748;
      --text-muted: #718096;
      --accent: #c9a227;
      --accent-soft: #f6e7b8;
      --border: #e2e8f0;
      --shadow: 0 4px 18px rgba(26, 54, 93, 0.07);
      --radius: 12px;
      --sidebar-w: 280px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Assistant', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #1a365d 0%, #2a4a7a 100%);
      color: white;
      padding: 1.8rem 1.5rem 1.5rem;
      text-align: center;
      position: relative;
    }
    .header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 20%, rgba(201,162,39,0.15), transparent 55%);
      pointer-events: none;
    }
    .header h1 {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: clamp(1.7rem, 4.5vw, 2.4rem);
      font-weight: 700;
      position: relative;
    }
    .header .subtitle {
      font-size: 1rem;
      opacity: 0.9;
      font-weight: 300;
      margin-top: 0.25rem;
      position: relative;
    }
    .header .count {
      margin-top: 0.8rem;
      display: inline-block;
      background: rgba(255,255,255,0.14);
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      position: relative;
    }
    .layout {
      display: flex;
      max-width: 1200px;
      margin: 0 auto;
      min-height: calc(100vh - 160px);
    }
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: white;
      border-left: 1px solid var(--border);
      padding: 1.2rem 0.9rem;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar-section { margin-bottom: 1.4rem; }
    .sidebar-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--bg-header);
      letter-spacing: 0.04em;
      padding: 0 0.5rem 0.45rem;
      margin-bottom: 0.35rem;
      border-bottom: 2px solid var(--accent-soft);
    }
    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0.45rem 0.65rem;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.92rem;
      color: var(--text);
      cursor: pointer;
      border-radius: 8px;
      text-align: right;
      transition: background 0.15s;
    }
    .nav-item:hover { background: #f0f4f8; }
    .nav-item.active {
      background: var(--bg-header);
      color: white;
      font-weight: 600;
    }
    .nav-item .badge {
      font-size: 0.72rem;
      background: #edf2f7;
      color: var(--text-muted);
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      min-width: 1.5rem;
      text-align: center;
    }
    .nav-item.active .badge {
      background: rgba(255,255,255,0.25);
      color: white;
    }
    .main {
      flex: 1;
      padding: 1.4rem 1.3rem 3rem;
      min-width: 0;
    }
    .search-box {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 0.75rem 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      border: 1px solid var(--border);
      margin-bottom: 1.2rem;
    }
    .search-box svg { width: 18px; height: 18px; color: var(--text-muted); flex-shrink: 0; }
    .search-box input {
      border: none; outline: none; flex: 1;
      font-family: inherit; font-size: 1rem;
      color: var(--text); background: transparent;
    }
    .search-box input::placeholder { color: #a0aec0; }
    .section-header {
      display: flex;
      align-items: baseline;
      gap: 0.7rem;
      margin-bottom: 1.1rem;
      flex-wrap: wrap;
    }
    .section-header h2 {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 1.45rem;
      color: var(--bg-header);
    }
    .section-header .meta {
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 0.9rem;
      border: 1px solid var(--border);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }
    .card:hover { box-shadow: 0 6px 24px rgba(26,54,93,0.11); }
    .card-header {
      padding: 1rem 1.2rem;
      cursor: pointer;
      display: flex;
      gap: 0.9rem;
      align-items: flex-start;
      user-select: none;
    }
    .card-date {
      flex-shrink: 0;
      background: var(--accent-soft);
      color: #744210;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.28rem 0.6rem;
      border-radius: 6px;
      white-space: nowrap;
    }
    .card-preview {
      flex: 1;
      min-width: 0;
      font-size: 0.98rem;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.55;
    }
    .card.open .card-preview { display: none; }
    .card-toggle {
      flex-shrink: 0;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: #edf2f7;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.25s, background 0.2s;
      margin-top: 0.1rem;
    }
    .card.open .card-toggle {
      transform: rotate(180deg);
      background: var(--accent-soft);
    }
    .card-toggle svg { width: 13px; height: 13px; color: var(--text-muted); }
    .card-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }
    .card.open .card-body { max-height: 4000px; }
    .card-content {
      padding: 0 1.2rem 1.3rem;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      font-size: 1.06rem;
      line-height: 1.85;
      white-space: pre-wrap;
      font-family: 'Frank Ruhl Libre', 'Assistant', serif;
      color: #1a202c;
    }
    .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }
    .footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: 0.82rem;
      border-top: 1px solid var(--border);
      background: white;
    }
    .back-top {
      position: fixed;
      bottom: 1.4rem;
      left: 1.4rem;
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--bg-header);
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(26,54,93,0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .back-top.visible { display: flex; }
    .mobile-nav-toggle {
      display: none;
      position: fixed;
      bottom: 1.4rem;
      right: 1.4rem;
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--bg-header);
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(26,54,93,0.4);
      z-index: 60;
      align-items: center;
      justify-content: center;
    }
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 40;
    }
    @media (max-width: 820px) {
      .layout { flex-direction: column; }
      .sidebar {
        position: fixed;
        top: 0; right: 0;
        width: min(300px, 85vw);
        height: 100%;
        z-index: 50;
        transform: translateX(100%);
        transition: transform 0.3s ease;
        box-shadow: -4px 0 24px rgba(0,0,0,0.15);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.open { display: block; }
      .mobile-nav-toggle { display: flex; }
      .main { padding: 1rem 0.9rem 5rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>חידושי הד״ע</h1>
    <p class="subtitle">דברי תורה מאת דן עוגן</p>
    <div class="count" id="total-count">טוען...</div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">ניווט</div>
        <button class="nav-item active" data-cat="all" data-sub="">
          <span>הכל</span>
          <span class="badge" id="badge-all">0</span>
        </button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">פרשות השבוע</div>
        <div id="nav-parashot"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">מועדים</div>
        <div id="nav-holidays"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">אחר</div>
        <button class="nav-item" data-cat="general" data-sub="כללי">
          <span>דברים כלליים</span>
          <span class="badge" id="badge-general">0</span>
        </button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="overlay"></div>
    <main class="main">
      <div class="search-box">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input type="search" id="search" placeholder="חיפוש בדברי התורה..." autocomplete="off">
      </div>
      <div class="section-header">
        <h2 id="section-title">הכל</h2>
        <span class="meta" id="section-meta"></span>
      </div>
      <div id="list"></div>
      <div class="empty" id="empty" style="display:none">
        <p>לא נמצאו תוצאות</p>
      </div>
    </main>
  </div>
  <footer class="footer">
    <p>נוצר ע״י דן עוגן | לזיכוי הרבים</p>
  </footer>
  <button class="back-top" id="back-top" title="חזרה למעלה">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7"/>
    </svg>
  </button>
  <button class="mobile-nav-toggle" id="menu-btn" aria-label="תפריט">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>
  <script src="data.js"></script>
  <script>
    const listEl = document.getElementById('list');
    const searchEl = document.getElementById('search');
    const emptyEl = document.getElementById('empty');
    const totalCountEl = document.getElementById('total-count');
    const sectionTitle = document.getElementById('section-title');
    const sectionMeta = document.getElementById('section-meta');
    const backTop = document.getElementById('back-top');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const menuBtn = document.getElementById('menu-btn');

    let currentCat = 'all';
    let currentSub = '';
    let searchQuery = '';

    function countBy(cat, sub) {
      return TORAH_DATA.filter(d => {
        if (cat === 'all') return true;
        if (cat === 'general') return d.category === 'general';
        return d.category === cat && d.subcategory === sub;
      }).length;
    }

    function buildNav() {
      const paraNav = document.getElementById('nav-parashot');
      const holNav = document.getElementById('nav-holidays');
      PARASHOT_ORDER.forEach(p => {
        const c = countBy('parasha', p);
        if (c === 0) return;
        const btn = document.createElement('button');
        btn.className = 'nav-item';
        btn.dataset.cat = 'parasha';
        btn.dataset.sub = p;
        btn.innerHTML = '<span>' + p + '</span><span class="badge">' + c + '</span>';
        btn.addEventListener('click', function() { selectNav('parasha', p, btn); });
        paraNav.appendChild(btn);
      });
      HOLIDAYS_ORDER.forEach(h => {
        const c = countBy('holiday', h);
        if (c === 0) return;
        const btn = document.createElement('button');
        btn.className = 'nav-item';
        btn.dataset.cat = 'holiday';
        btn.dataset.sub = h;
        btn.innerHTML = '<span>' + h + '</span><span class="badge">' + c + '</span>';
        btn.addEventListener('click', function() { selectNav('holiday', h, btn); });
        holNav.appendChild(btn);
      });
      document.getElementById('badge-all').textContent = TORAH_DATA.length;
      document.getElementById('badge-general').textContent = countBy('general', 'כללי');
      document.querySelectorAll('.nav-item[data-cat="all"], .nav-item[data-cat="general"]').forEach(btn => {
        btn.addEventListener('click', function() {
          selectNav(btn.dataset.cat, btn.dataset.sub || '', btn);
        });
      });
    }

    function selectNav(cat, sub, btn) {
      currentCat = cat;
      currentSub = sub;
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
      render();
    }

    function getFiltered() {
      return TORAH_DATA.filter(item => {
        let catMatch = true;
        if (currentCat === 'all') catMatch = true;
        else if (currentCat === 'general') catMatch = item.category === 'general';
        else catMatch = item.category === currentCat && item.subcategory === currentSub;
        if (!catMatch) return false;
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        return item.text.toLowerCase().includes(q) || item.date.includes(q);
      });
    }

    function render() {
      const filtered = getFiltered();
      totalCountEl.textContent = TORAH_DATA.length + ' דברי תורה';
      if (currentCat === 'all') sectionTitle.textContent = 'הכל';
      else if (currentCat === 'general') sectionTitle.textContent = 'דברים כלליים';
      else if (currentCat === 'parasha') sectionTitle.textContent = 'פרשת ' + currentSub;
      else sectionTitle.textContent = currentSub;
      sectionMeta.textContent = filtered.length + ' רשומות';
      listEl.innerHTML = '';
      emptyEl.style.display = filtered.length ? 'none' : 'block';
      filtered.forEach(item => {
        const card = document.createElement('article');
        card.className = 'card';
        const dateOnly = item.date.split(',')[0];
        card.innerHTML =
          '<div class="card-header">' +
            '<div class="card-date">' + dateOnly + '</div>' +
            '<div class="card-preview">' + escapeHtml(item.preview) + '</div>' +
            '<div class="card-toggle"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg></div>' +
          '</div>' +
          '<div class="card-body"><div class="card-content">' + escapeHtml(item.text) + '</div></div>';
        card.querySelector('.card-header').addEventListener('click', function() {
          card.classList.toggle('open');
        });
        listEl.appendChild(card);
      });
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    let t;
    searchEl.addEventListener('input', function() {
      clearTimeout(t);
      t = setTimeout(function() {
        searchQuery = searchEl.value.trim();
        render();
      }, 180);
    });
    window.addEventListener('scroll', function() {
      backTop.classList.toggle('visible', window.scrollY > 350);
    });
    backTop.addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });
    menuBtn.addEventListener('click', function() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
    });
    overlay.addEventListener('click', function() {
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
    });
    buildNav();
    render();
  </script>
</body>
</html>
